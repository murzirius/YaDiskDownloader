name: Checks and native builds
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    timeout-minutes: 45
    env:
      YADISK_TEST_TIMEOUT_FACTOR: '4'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install fixed SQLite on Windows
        if: runner.os == 'Windows'
        run: python tools/prepare_sqlite_windows.py
      - name: Build isolated fixed SQLite on Linux
        if: runner.os == 'Linux'
        run: python tools/prepare_sqlite_linux.py
      - run: python -m pip install -r requirements-bootstrap.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Record tested revision and runtime
        run: python -c "import os, sys, sqlite3; from disk_downloader import __version__; from disk_downloader.sqlite_support import require_safe, journal_mode; require_safe() if sys.platform != 'darwin' else None; print('Journal:', journal_mode()); from disk_downloader.limits import MAX_WORKERS; print('Commit:', os.environ.get('GITHUB_SHA')); print('Application:', __version__); print('Workers:', MAX_WORKERS); print('Python:', sys.version); print('SQLite:', sqlite3.sqlite_version)"
      - name: Check parallel socket recovery independently on macOS
        if: runner.os == 'macOS'
        run: python -m pytest -q tests/test_network_recovery.py::test_real_parallel_http_disconnect_resumes_without_old_socket_timeout -o faulthandler_timeout=60
      - run: python -m pytest -q --durations=15 --junitxml=test-results.xml -o faulthandler_timeout=180
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  windows_exe:
    timeout-minutes: 30
    needs: [tests, native_cli, dependencies]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python tools/prepare_sqlite_windows.py
      - run: python -m pip install -r requirements-bootstrap.txt
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/package_release.py --check-tag
      - name: Check native layout at 100, 150 and 200 percent
        run: python tools/check_desktop_dpi.py --output desktop-dpi-results.json
      - run: python build_windows.py --output dist/windows --work build/windows
      - name: Smoke actual EXE, UI, patched SQLite, tray and full shutdown
        run: python tools/smoke_windows_exe.py --exe dist/windows/YaDiskDownloader.exe --output smoke-results.json
      - name: Check background SQLite diagnostics in actual EXE
        run: python tools/check_exe_database_errors.py --exe dist/windows/YaDiskDownloader.exe --output database-error-results.json
      - name: Recover unreadable application history in actual EXE
        run: python tools/check_exe_history_recovery.py --exe dist/windows/YaDiskDownloader.exe --output history-recovery-application.json
      - name: Recover unreadable portable inventory in actual EXE
        run: python tools/check_exe_history_recovery.py --portable --exe dist/windows/YaDiskDownloader.exe --output history-recovery-portable.json
      - name: Save EXE smoke results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe-smoke
          path: |
            smoke-results.json
            desktop-dpi-results.json
            database-error-results.json
            history-recovery-application.json
            history-recovery-portable.json
          if-no-files-found: ignore
      - run: python -m pip download --no-deps --dest dist/windows/third_party pystray==0.19.5
      - run: python tools/package_release.py --exe dist/windows/YaDiskDownloader.exe --output dist/release
      - uses: actions/upload-artifact@v6
        with:
          name: Windows-release
          path: |
            dist/release/*-Windows-x64.zip
      - name: Publish checked release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $appVersion = python -c "from disk_downloader import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $windowsArchive = "dist/release/YaDiskDownloader-v${appVersion}-Windows-x64.zip"
          foreach ($archive in @($windowsArchive)) {
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Release archive is missing: $archive"
            }
          }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseOptions = @()
            if ($env:RELEASE_TAG -like '*-build.*') { $releaseOptions += '--prerelease' }
            gh release create $env:RELEASE_TAG --verify-tag --title "YaDiskDownloader $env:RELEASE_TAG" --notes-file "docs/release-v${appVersion}.md" @releaseOptions
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG $windowsArchive --clobber
          exit $LASTEXITCODE

  native_cli:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - run: python build_posix.py --output dist/native --work build/native
      - run: python tools/smoke_cli.py --exe dist/native/yadisk --output native-smoke.json
      - run: python tools/package_native.py --binary dist/native/yadisk --output dist/native-package
      - name: Save native build and actual binary checks
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/native-package/
            native-smoke.json
          if-no-files-found: error

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
