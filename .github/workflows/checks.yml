name: Checks and Windows release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-bootstrap.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-bootstrap.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/package_release.py --check-tag
      - run: python build_windows.py --output dist/windows --work build/windows
      - run: python -m pip download --no-deps --dest dist/windows/third_party pystray==0.19.5
      - run: python tools/package_release.py --exe dist/windows/YaDiskDownloader.exe --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-release
          path: dist/release/*
      - name: Publish checked release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title "YaDiskDownloader $env:RELEASE_TAG" --notes-file "docs/release-$env:RELEASE_TAG.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG dist/release/* --clobber
          exit $LASTEXITCODE
